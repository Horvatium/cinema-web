server {
    listen 80;
    root /usr/share/nginx/html;

    # Enaka varnostna politika kot na Vercelu (vercel.json)
    add_header Content-Security-Policy "script-src 'self' https://js.stripe.com https://m.stripe.network; frame-src 'self' https://js.stripe.com" always;

    # Datoteke z zgoščeno vrednostjo v imenu se ne spreminjajo, zato jih dolgo predpomnimo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Usmerjanje na odjemalcu: neznane poti vrnejo index.html
    location / {
        try_files $uri /index.html;
    }
}
